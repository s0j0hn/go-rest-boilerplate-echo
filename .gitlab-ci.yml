# ===== BUILD STAGE =====
build:
  stage: build
  except:
    - tags
  variables:
    DOCKER_BUILDKIT: 1
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  image: docker:latest
  services:
    - docker:dind
  # No tags needed - uses GitLab shared runners with Docker support
  # Override default before_script since this job uses Docker, not Go directly
  before_script:
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      docker build --cache-from $IMAGE_TAG_LATEST
      --build-arg CI_COMMIT_SHA=$CI_COMMIT_SHA
      --build-arg CI_COMMIT_REF_SLUG=$CI_COMMIT_REF_SLUG
      --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      --tag $IMAGE_TAG .
    - docker push $IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag $IMAGE_TAG $IMAGE_TAG_LATEST
        docker push $IMAGE_TAG_LATEST
      fi

# ===== SECURITY STAGE =====
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  #- template: Security/API-Fuzzing.gitlab-ci.yml

# Override security job settings
sast:
  stage: security
  # Override before_script since SAST uses its own image without Go
  before_script: []
  variables:
    SAST_EXCLUDED_PATHS: "vendor, .go-cache, docs"
    SCAN_KUBERNETES_MANIFESTS: "true"

dependency_scanning:
  stage: security
  # Override before_script since dependency scanning uses its own image
  before_script: []
  variables:
    DS_EXCLUDED_PATHS: "vendor, .go-cache"

container_scanning:
  stage: security
  # Override before_script since container scanning uses its own image
  before_script: []
  variables:
    CS_IMAGE: $IMAGE_TAG
    CS_DOCKERFILE_PATH: "Dockerfile"

secret_detection:
  stage: security
  # Override before_script since secret detection uses its own image
  before_script: []
  variables:
    SECRET_DETECTION_EXCLUDED_PATHS: "vendor, .go-cache"

